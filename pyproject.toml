[project]
name = "mnemosyne"
version = "0.1.0.dev1"
description = "Media acquisition and library-normalization pipeline for ebooks, audiobooks, and music."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "mutagen>=1.47,<2",
    "pydantic>=2.8,<3",
    "rich>=13.7,<15",
    "tomlkit>=0.13,<1",
    "typer>=0.12,<1",
]

[project.scripts]
mnemosyne = "mnemosyne.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemosyne"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
